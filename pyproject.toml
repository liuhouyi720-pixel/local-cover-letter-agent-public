[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "big-four-us-job-monitor"
version = "0.1.0"
description = "Deterministic, local-first monitor for official Big Four US career sites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "lxml>=5,<7",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "tenacity>=8.5,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
big-four-monitor = "big_four_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
