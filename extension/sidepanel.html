<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JD Import</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="panel">
    <header class="panelHeader">
      <h1>JD Import</h1>
      <p class="subtle" id="statusText">Ready</p>
    </header>

    <section class="metaGrid">
      <div>
        <span class="label">Detection</span>
        <strong id="detectionBadge">Unsupported page</strong>
      </div>
      <div>
        <span class="label">Confidence</span>
        <strong id="confidenceBadge">low</strong>
      </div>
    </section>

    <label>
      Title
      <input id="titleInput" type="text" placeholder="Job title" />
    </label>

    <label>
      Company
      <input id="companyInput" type="text" placeholder="Company name" />
    </label>

    <label>
      Location
      <input id="locationInput" type="text" placeholder="Location" />
    </label>

    <label>
      URL
      <input id="urlInput" type="text" placeholder="Page URL" />
    </label>

    <label>
      Description
      <textarea id="descriptionInput" rows="12" placeholder="Extracted job description"></textarea>
    </label>

    <div class="row">
      <button id="extractBtn" type="button">Extract JD</button>
      <button id="reExtractBtn" type="button">Re-extract</button>
    </div>

    <div class="row">
      <button id="sendBtn" type="button" class="primary">Send to Local Agent</button>
      <button id="openBtn" type="button">Open Local Agent</button>
    </div>

    <section>
      <p class="label">Warnings</p>
      <ul id="warningsList" class="warningsList"></ul>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
